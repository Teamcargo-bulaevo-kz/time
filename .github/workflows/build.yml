name: Build Audit APK

on:
  push:
    branches: [main, ccr-d31c4d71-jkq0pe]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Сборка APK + юнит-тесты математики сонара
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk: ${{ steps.check.outputs.apk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p out/test-results
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace --continue assembleRelease 2>&1 | tee out/build.log
          status=${PIPESTATUS[0]}
          echo "$status" > out/status.txt
          cp app/build/test-results/testReleaseUnitTest/*.xml out/test-results/ 2>/dev/null || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/Audit.apk
          fi
          exit 0

      - name: Check result
        id: check
        shell: bash
        run: |
          if [ -f out/Audit.apk ]; then echo "apk=true" >> "$GITHUB_OUTPUT"; else echo "apk=false" >> "$GITHUB_OUTPUT"; fi
          echo "gradle exit status: $(cat out/status.txt)"
          if [ ! -f out/Audit.apk ] || [ "$(cat out/status.txt)" != "0" ]; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-build
          path: out
          retention-days: 7

  # 2. Запуск APK в эмуляторе Android 10: сканирование, отчёт, поиск падений
  smoke:
    needs: build
    if: ${{ always() && needs.build.outputs.apk == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: out-build
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-smoke
          path: smoke-out
          retention-days: 7

  # 3. Публикация: логи/APK в служебную ветку ci-build (её читает разработчик) и релиз "latest"
  publish:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out-build
          path: out

      - name: Push build output to branch ci-build
        shell: bash
        run: |
          rm -rf /tmp/cib && mkdir /tmp/cib && cp -r out/. /tmp/cib/
          echo "${GITHUB_SHA}" > /tmp/cib/commit.txt
          cd /tmp/cib
          git init -q -b ci-build
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-build

      - name: Publish release "latest"
        if: ${{ needs.build.outputs.apk == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-d31c4d71-jkq0pe') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(cat out/status.txt)" = "0" ]; then
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest out/Audit.apk \
              --title "Аудит — последняя сборка" \
              --notes "Установочный файл Audit.apk (commit ${GITHUB_SHA::7}). Скачать на телефон и открыть. Подробности — в README." \
              --target "${GITHUB_SHA}"
          else
            echo "Сборка/тесты не прошли — релиз не обновляется"
          fi

  publish-smoke:
    needs: smoke
    if: ${{ always() && needs.smoke.result != 'skipped' && needs.smoke.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out-smoke
          path: smoke-out

      - name: Push smoke output to branch ci-smoke
        shell: bash
        run: |
          rm -rf /tmp/cis && mkdir /tmp/cis && cp -r smoke-out/. /tmp/cis/
          echo "${GITHUB_SHA}" > /tmp/cis/commit.txt
          cd /tmp/cis
          git init -q -b ci-smoke
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "smoke output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-smoke
